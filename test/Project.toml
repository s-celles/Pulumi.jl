# Test-only dependencies. Julia resolves this environment on top of the
# package's own Project.toml, which keeps the [extras]/[targets] pair out of
# the root manifest.
[deps]
Aqua = "4c88cf16-eb10-579e-8560-4a9242c79595"
BenchmarkTools = "6e4b80f9-dd63-53aa-95a3-0cdb28fa8baf"
Pulumi = "90af1f71-c6d8-4a0a-9f87-1292e80e7fff"
Sockets = "6462fe0b-24de-5631-8697-dd941f90decc"
Test = "8dfed614-e22c-5e08-85e1-65c5234f0b40"
TestItemRunner = "f8b46487-2199-4994-9208-9a1283c18c0a"
TestItems = "1c621080-faea-4a02-84b6-bbd5e436b8fe"
# The fake engine in test_support.jl serves gRPC itself.
gRPCServer = "608c6337-0d7d-447f-bb69-0f5674ee3959"

[sources]
Pulumi = {path = ".."}

[compat]
Aqua = "0.8"
BenchmarkTools = "1"
Sockets = "1"
Test = "1"
TestItemRunner = "1"
TestItems = "1"
gRPCServer = "0.1"
